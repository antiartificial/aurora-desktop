[package]
name = "aurora-compositor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aurora-compositor"
path = "src/main.rs"

[dependencies]
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"
tracing = "0.1"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
png = "0.17"
libc = "0.2.191"
toml = "0.9"
toml_edit = "0.25"
cosmic-text = "0.19.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

# Pinned to the commit of the clone at ~/.cache/aurora/smithay (harness/nested-up
# uses the same SMITHAY_REV). Cargo.lock records it too.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "65aa86fa5236e41775c313408102a5d5c2d1e2ca"
default-features = false
features = ["backend_winit", "wayland_frontend", "desktop"]

[dev-dependencies]
memmap2 = "0.9"
png = "0.17"
serde_json = "1.0.154"
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
