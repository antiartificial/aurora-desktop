<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Aurora desktop icon, full detail (48px and up). Palette = contracts/theme/aurora-glass.toml
       [wallpaper] top/bottom/accent in sRGB: #0a2450 -> #0f051d, bloom #aa66c0, focus ring #6b4ec7. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143a78"/><stop offset="0.55" stop-color="#0a2450"/><stop offset="1" stop-color="#0f051d"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#aa66c0" stop-opacity="0.55"/><stop offset="1" stop-color="#aa66c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fb7ff"/><stop offset="0.5" stop-color="#b58cff"/><stop offset="1" stop-color="#ff9bd8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="tile"><rect x="12" y="12" width="232" height="232" rx="54"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#field)"/>
    <rect width="256" height="256" fill="url(#bloom)"/>
    <!-- the aurora: one bright ribbon sweeping up through the field -->
    <path d="M-10 176 C 50 150, 90 70, 150 66 S 230 90, 270 40" fill="none" stroke="url(#ribbon)" stroke-width="30" stroke-linecap="round" opacity="0.55" filter="url(#soft)"/>
    <path d="M-10 176 C 50 150, 90 70, 150 66 S 230 90, 270 40" fill="none" stroke="url(#ribbon)" stroke-width="17" stroke-linecap="round"/>
    <!-- a glass pane resting in front: the desktop's one material -->
    <rect x="60" y="112" width="136" height="104" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3"/>
    <!-- title bar rule and three bus nodes joined by one line -->
    <path d="M60 146 H196" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M94 183 H162" stroke="#ffffff" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="94" cy="183" r="9" fill="#ffffff"/><circle cx="128" cy="183" r="9" fill="#ffffff"/><circle cx="162" cy="183" r="9" fill="#ffffff"/>
  </g>
  <rect x="13.5" y="13.5" width="229" height="229" rx="52.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
</svg>
