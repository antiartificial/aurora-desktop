<meta name="description" content="Toolkit design notes for Aurora, a toy desktop OS.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* A fixed contents rail, one measured column of document beside it. Palette from the
   compositor's own wallpaper and bloom tokens (contracts/theme/aurora-glass.toml). */
:root {
  --ink:#171320; --ink-soft:#595269; --ink-faint:#8a839b;
  --paper:#faf8fb; --raise:#fff; --rule:#e3dfe9;
  --accent:#6d3f99; --accent-dim:#efe6f7; --code-bg:#f2eff5;
  --serif:"IBM Plex Serif",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --rail:290px; --measure:70ch;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink:#e9e4f2; --ink-soft:#a79fba; --ink-faint:#776e8c;
    --paper:#0f0b17; --raise:#17121f; --rule:#2b2338;
    --accent:#c08ae8; --accent-dim:#241a33; --code-bg:#1a1424;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.62;margin:0}
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:48px;align-items:start;
  max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.rail{position:sticky;top:28px;max-height:calc(100vh - 80px);overflow-y:auto;padding-block:28px;font-size:13.5px}
.rail .home{display:inline-block;color:var(--ink-faint);text-decoration:none;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.rail .home:hover{color:var(--accent)}
.rail .mark{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
.rail .sub{color:var(--ink-faint);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 22px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.rail a.s{display:grid;grid-template-columns:1.9em 1fr;gap:6px;padding:5px 9px 5px 6px;color:var(--ink-soft);
  text-decoration:none;border-radius:5px;border-left:2px solid transparent}
.rail a.s:hover{background:var(--accent-dim);color:var(--ink)}
.rail a.s.on{background:var(--accent-dim);color:var(--ink);border-left-color:var(--accent);font-weight:500}
.rail a.s .n{color:var(--ink-faint);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.rail a.s.on .n{color:var(--accent)}
.doc{min-width:0;padding-block:28px}
.doc>*{max-width:var(--measure)}
.doc h1{font-family:var(--serif);font-size:clamp(30px,5vw,44px);font-weight:600;line-height:1.12;
  letter-spacing:-.02em;text-wrap:balance;margin:0 0 20px}
.doc h2{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.22;text-wrap:balance;
  margin:64px 0 14px;padding-top:22px;border-top:1px solid var(--rule);scroll-margin-top:24px}
.doc h2:first-of-type{border-top:0;padding-top:0}
.doc h3{font-size:16px;font-weight:600;margin:34px 0 10px;scroll-margin-top:24px}
.doc h4{font-size:14px;font-weight:600;color:var(--ink-soft);margin:22px 0 8px}
.doc p{margin:0 0 14px}
.doc ul,.doc ol{margin:0 0 16px;padding-left:1.3em}
.doc li{margin-bottom:6px}
.doc li::marker{color:var(--ink-faint)}
.doc a{color:var(--accent);text-underline-offset:2px}
.doc hr{border:0;border-top:1px solid var(--rule);margin:40px 0;max-width:var(--measure)}
.doc code{font-family:var(--mono);font-size:.875em;background:var(--code-bg);padding:.12em .36em;
  border-radius:3px;overflow-wrap:break-word}
.doc pre{background:var(--code-bg);border:1px solid var(--rule);border-radius:7px;padding:14px 16px;
  overflow-x:auto;margin:0 0 18px;line-height:1.55}
.doc pre code{background:none;padding:0;font-size:13px}
.doc blockquote{margin:0 0 18px;padding:2px 0 2px 16px;border-left:2px solid var(--accent);color:var(--ink-soft)}
.tablewrap{overflow-x:auto;margin:0 0 20px;max-width:var(--measure)}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums;background:var(--raise)}
.doc th,.doc td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.doc thead th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:600;border-bottom:1px solid var(--ink-faint);white-space:nowrap}
.doc tbody tr:last-child td{border-bottom:0}
.doc td code{font-size:12.5px;white-space:nowrap}
.lede{font-size:16.5px;color:var(--ink-soft);border-left:2px solid var(--accent);padding-left:18px;margin:0 0 34px}
/* Diagrams. A figure is a first-class block here: the design documents lean on layout
   wireframes and flow diagrams to say things prose says badly. Inline SVG inherits the page's
   colour tokens via currentColor and the .dg-* classes, so one drawing serves both schemes. */
figure{margin:0 0 24px;max-width:var(--measure)}
figure svg,figure .mermaid{display:block;max-width:100%;height:auto;margin:0 auto}
figure figcaption{color:var(--ink-faint);font-size:12.5px;margin-top:10px;text-align:center}
figure.wide{max-width:none}
.dg-ink{fill:var(--ink)} .dg-soft{fill:var(--ink-soft)} .dg-faint{fill:var(--ink-faint)}
.dg-accent{fill:var(--accent)} .dg-surface{fill:var(--raise)} .dg-alt{fill:var(--code-bg)}
.dg-line{stroke:var(--rule);fill:none} .dg-edge{stroke:var(--ink-faint);fill:none}
.dg-mark{stroke:var(--accent);fill:none}
.dg-label{fill:var(--ink-soft);font-family:var(--sans);font-size:11px}
.dg-mono{fill:var(--ink-faint);font-family:var(--mono);font-size:10.5px}
.mermaid{background:none!important}
.lede p:last-child{margin-bottom:0}
.src{margin-top:60px;padding-top:18px;border-top:1px solid var(--rule);color:var(--ink-faint);font-size:13px;max-width:var(--measure)}
.src a{color:var(--accent)}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{position:static;max-height:none;overflow:visible;border-bottom:1px solid var(--rule);
    padding-bottom:20px;margin-bottom:8px}
  .rail ol{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px}
  .doc>*,.tablewrap,.doc hr,.src{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>
</head>

<script>

  doc.querySelectorAll("table").forEach(function (t) {
