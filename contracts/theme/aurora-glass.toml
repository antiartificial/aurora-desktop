# Aurora theme parameters, v1: Phase 1's glass and window switcher.
#
# Read by compositor/ (src/fx/theme.rs) and HOT-RELOADED: save this file and
# the next frame (polled every 250 ms) uses the new values. A file that does not
# parse is rejected whole and the last good theme stays in force. Phase 8's
# theme engine is meant to consume exactly this shape: tokens in Oklab, plus
# the shaders in shaders/. Unknown keys are ignored; missing keys take the
# defaults written here.
#
# Colours are Oklab [L, a, b] (L 0..1, a and b about -0.4..0.4). The compositor
# converts them to linear light on load. Oklab is for authoring only: no shader
# does arithmetic in it. Where each operation happens (decision 0010, section 1):
#   blur, glass tint, luminance ceiling, edge highlight ... LINEAR light
#   client window translucency over the scene ............ ENCODED (sRGB), on
#                                                          purpose: client alpha is
#                                                          authored for it
#   the finished glass is encoded to sRGB where it meets the scene.

[theme]
name = "aurora-glass"
version = 1

# --- Toolkit: what Haiku apps (kits/interface) read ----------------------------------------------
# Added 2026-11-06. The compositor ignores these two tables (unknown keys are ignored); the Interface
# Kit's colour table and AuroraControlLook (kits/interface/aurora_theme.cpp) read them. Nothing here is
# drawn by the compositor, and a Haiku app reads the file once, at start: it is not hot-reloaded.
#
# One rule turns an Oklab token into the sRGB bytes of an rgb_color, and it is the compositor's own
# (compositor/src/fx/theme.rs oklab_to_u8), in 32-bit float: Ottosson's Oklab -> linear sRGB matrices,
# each channel clamped to 0..1, the IEC 61966-2-1 encode, times 255, rounded to nearest; alpha 255.
# So a token that is also a compositor token (background.top, below) gives identical bytes in both.
# demos/theme-drift/run.sh pins this against the compositor's own source and its rendered pixels.
#
# The surfaces are a calm cool light: window glass is the one luminous material (window glass
# tint, L 0.80), and a client panel on it has to read as part of it. Contrast floors (WCAG 2, the same
# ones docs/visual-system.md section 8.2 sets for the shell): text on its surface >= 4.5:1, the focus
# accent on panel and document >= 3:1 (non-text), control border and scroll thumb on panel >= 3:1.
# kits/interface/tests/test_theme.cpp checks them against whatever is written here, so a re-tint cannot
# silently break legibility.
[theme.colors]
panel = [0.94, -0.002, -0.007]          # B_PANEL_BACKGROUND_COLOR
panel_text = [0.24, -0.002, -0.012]     # B_PANEL_TEXT, B_CONTROL_TEXT, B_MENU_ITEM_TEXT, B_MENU_SELECTED_ITEM_TEXT, B_NAVIGATION_PULSE
menu = [0.96, -0.002, -0.007]           # B_MENU_BACKGROUND_COLOR
menu_selected = [0.86, 0.02, -0.06]     # B_MENU_SELECTED_BACKGROUND_COLOR
document = [0.99, 0.0, 0.0]             # B_DOCUMENT_BACKGROUND, B_LIST_BACKGROUND
document_text = [0.22, 0.0, -0.008]    # B_DOCUMENT_TEXT, B_LIST_ITEM_TEXT, B_LIST_SELECTED_ITEM_TEXT
control = [0.97, -0.002, -0.006]        # B_CONTROL_BACKGROUND_COLOR
control_border = [0.62, -0.008, -0.025] # B_CONTROL_BORDER_COLOR
control_highlight = [0.80, 0.03, -0.08] # B_CONTROL_HIGHLIGHT_COLOR
control_mark = [0.40, 0.05, -0.14]      # B_CONTROL_MARK_COLOR (check marks, radio dots)
accent = [0.52, 0.06, -0.17]            # B_KEYBOARD_NAVIGATION_COLOR (the focus ring), B_MENU_SELECTED_BORDER_COLOR
list_selected = [0.84, 0.02, -0.07]     # B_LIST_SELECTED_BACKGROUND_COLOR
scroll_thumb = [0.62, -0.008, -0.03]    # B_SCROLL_BAR_THUMB_COLOR
tooltip = [0.985, 0.0, 0.0]             # B_TOOLTIP_BACKGROUND_COLOR (its text is panel_text)
shine = [1.0, 0.0, 0.0]                 # B_SHINE_COLOR
shadow = [0.0, 0.0, 0.0]                # B_SHADOW_COLOR
link = [0.50, 0.05, -0.17]              # B_LINK_TEXT_COLOR
link_hover = [0.58, 0.06, -0.16]        # B_LINK_HOVER_COLOR
link_visited = [0.48, 0.07, -0.07]      # B_LINK_VISITED_COLOR
link_active = [0.44, 0.05, -0.15]       # B_LINK_ACTIVE_COLOR
status_bar = [0.62, 0.07, -0.17]        # B_STATUS_BAR_COLOR
success = [0.72, -0.14, 0.10]           # B_SUCCESS_COLOR
failure = [0.60, 0.19, 0.07]            # B_FAILURE_COLOR
# B_DESKTOP_COLOR is background.top, the desktop's own token. The B_WINDOW_* tab and border colours
# are not mapped: the compositor draws no window decorations (docs/visual-system.md, "What Aurora will not do").

[theme.controls]
# "aurora": AuroraControlLook (rounded, quiet, a two-pixel focus ring). "haiku": stock HaikuControlLook,
# the way back and the comparison. The environment variable AURORA_CONTROL_LOOK=haiku|aurora overrides it.
look = "aurora"
# "aurora": ui_color() answers the [theme.colors] table above. "haiku": Haiku's own compiled-in greys, for a stock
# comparison. AURORA_COLORS=haiku|aurora overrides it. Independent of `look`.
colors = "aurora"
# Corner radius as a fraction of a control's shorter side. 0.28 is the dock tile's rule
# (docs/visual-system.md section 3.6: tile.corner_radius = 0.28 * tile_size), applied to controls, and
# clamped to 2..8 px so a tall box is not a pill and a small one is not square. It deliberately stays
# well under glass.corner_radius (12): a control inside a window is nested, so its radius is smaller.
corner_ratio = 0.28

[glass]
enabled = true
# Dual-Kawase sampling offset multiplier (1.0 = the textbook kernel). WINDOW glass
# only; chrome glass has its own, below. Window glass blurs from the half-resolution
# copy of the scene, chrome glass from the quarter-resolution one (see [glass.chrome]).
blur_radius = 2.0
# Number of downsample steps (and the same number of upsample steps) per glass chain, 1..6.
blur_passes = 2
# Pixels. The glass layer is clipped to a rounded rectangle of the window.
corner_radius = 12.0
# Blur in linear light (an average of light). false averages sRGB-encoded values,
# which is always too dark (black and white meet at code 128, not 188): kept only
# for A/B comparison.
linear_blur = true
# Storage of the blur chain's intermediate targets, always holding sqrt(linear light):
#   "rgb10" Abgr2101010, 4 bytes/px (needs GLES 3.0; on GLES 2 the chain falls back to
#           8 bits and the compositor logs a warning)
#   "fp16"  Abgr16161616f, 8 bytes/px: an A/B instrument
#   "srgb8" Abgr8888 holding sRGB-encoded values, blurred as encoded: the pre-0010 look
precision = "rgb10"
# The scene is downsampled once (the "prepass") and every glass surface blurs from that copy,
# so the cost of N surfaces is not N full-size chains. The prepass is redone only when a
# surface lies within the blur's reach of something drawn since it ran, which is what lets glass
# over glass, and the dock over a window, see what is under them. false redoes it for every
# surface: slower, and identical pixels; for A/B and for testing the sharing.
share_prepass = true

[glass.tint]
oklab = [0.80, -0.01, -0.04]
# Mixed in LINEAR light. 0.10 is a starting point set for the linear mix (0.22 was
# tuned for an encoded-space mix and is far too bright now), not a derived value.
strength = 0.10        # 0 = pure blur, 1 = flat colour

[glass.edge]
oklab = [0.98, 0.0, 0.0]
width = 1.5            # pixels, measured inward from the window edge
strength = 0.75        # fades from top (full) to bottom (45%) of the window

[glass.chrome]
# Chrome glass sits under compositor-drawn text: the dock, the desktop menu, the
# settings panel and the switcher's backdrop. Unlike window glass it has a dark tint and an
# ENFORCED luminance ceiling, so that text on it keeps a contrast floor over ANY backdrop,
# including a white one.
#
# The ceiling is a Reinhard roll-off of the backdrop's luminance in linear light, applied
# before the tint:  Yb = dot(backdrop, (0.2126, 0.7152, 0.0722));  backdrop *= 1 / (1 + Yb / Ymax)
# Scaling the linear triple keeps hue, and the result asymptotes to Ymax rather than flattening.
# The worst-case glass luminance is  Ymax * (1 - strength) + Y_tint * strength  for every
# possible backdrop, so the floor holds by construction:
#   contrast floor = (Y_text + 0.05) / (Y_glass_max + 0.05)
# With the values below  Y_glass_max = 0.16 * 0.55 + 0.055 * 0.45 = 0.1127, and the dock's
# text (Oklab L 0.97, Y = 0.913) has a floor of 5.9:1, against WCAG 2's 4.5:1 for body text.
# To choose Ymax for a floor R:  Ymax = ((Y_text + 0.05) / R - 0.05 - Y_tint * strength) / (1 - strength)
# Replaced as a whole when set: give oklab and strength together.
tint = { oklab = [0.38, -0.005, -0.020], strength = 0.45 }   # tint luminance 0.055, linear
luminance_max = 0.16     # Ymax, linear light; 0 = no ceiling (then there is NO contrast guarantee)
# Chrome blurs from the QUARTER-resolution copy of the scene, so with the same offset it has twice
# window glass's sigma: chrome's job is to suppress the backdrop, not to show it.
# Kernel width (calibrated against fx/blur.rs, +-7%; docs/visual-system.md section 3.2):
#   sigma ~= 0.75 * blur_radius * 2^blur_passes * 2^level   full-resolution device pixels
# where level is 1 for window glass (half) and 2 for chrome (quarter). It is multiplied by the output scale.
blur_radius = 2.0

[switcher]
layout = "flip"        # "grid" or "flip"
backdrop_dim = 0.45    # black over the blurred desktop, 0..1
flip_angle_deg = 42.0
accent = [0.72, 0.10, 0.12]  # Oklab, the selected card's border

# --- Phase 8 shell: desktop, dock, text and input -----------------------------
# Added 2026-11-06. Every key below is its built-in default, so deleting a
# section changes nothing; they are written out because this file is meant to be
# the complete reference for what the compositor reads.

[background]
# shader | image | gradient | solid
mode = "shader"
# Used only by mode = "image". Cover-fit, centre-cropped, Lanczos3. Re-read when
# its mtime changes; an unreadable path falls back to the gradient.
image = ""
# Oklab tokens. "shader" and "gradient" run top -> bottom; accent is the bloom.
top = [0.27, -0.015, -0.085]
bottom = [0.15, 0.025, -0.045]
accent = [0.62, 0.11, -0.10]
# Multiplies the shader's time uniform. 0 freezes it.
speed = 1.0

[desktop]
clock = true
hostname = true
clock_oklab = [0.97, 0.0, 0.0]

[dock]
enabled = true
# bottom | top | left | right. The dock reserves its strip, so a maximised
# window is sized to the area that is left.
edge = "bottom"
item_height = 36.0
gap = 10.0
padding = 8.0
spacing = 6.0
hover_oklab = [0.95, 0.0, 0.0]
hover_strength = 0.22
text_oklab = [0.97, 0.0, 0.0]
# Terminal used when launching an app that wants one. "auto" tries ghostty,
# foot, kitty, alacritty, konsole, xterm in that order.
terminal = "auto"

[font]
# An extra font file to load alongside the system fonts ("" = none).
file = ""
# Preferred family ("" = first installed from a built-in preference list).
family = ""
# Logical pixels. Glyphs are rasterised at size x output scale, so this stays
# the same number whatever the display scale.
size = 14.0

[input]
# xkb. Empty means the server default, which is a US layout.
rules = ""
model = ""
layout = ""
variant = ""
options = ""
# Milliseconds before a held key repeats, and repeats per second.
repeat_delay = 200
repeat_rate = 25

[output]
# Device pixels per logical pixel. 0 = follow the host (the winit window's
# factor, or --scale when headless). The settings panel writes this key when a
# scale is chosen. Fractional values are honoured: the compositor advertises
# wp_fractional_scale to clients that bind it and the integer ceiling on
# wl_output for those that do not.
scale = 0.0

[decoration]
# The title bar the compositor draws above a window that did not draw its own (every Haiku
# window, anything that asks xdg-decoration for server-side, every managed X11 window).
# A client that asks to decorate itself, and every override-redirect X11 window (menus, tooltips),
# is left bare. Sizes are logical pixels.
enabled = true
# "bar": a glass bar the width of the window, with the close button at its left.
# "tab": BeOS's tab: the same chrome, but only as wide as the title, hung from the window's
#        top-left corner. The bar is the better default (a wider drag and double-click target,
#        and the title always has room); the tab is the Haiku look.
style = "bar"
# Bar height. A touch taller than the dock's text so the close button is a real target.
height = 30.0
# Resize tolerance: a press this far OUTSIDE a window's frame (left, right, bottom, above the bar)
# still grabs that edge. 8 is 8 px at scale 1 and 11.6 at 1.45. Nothing is taken from the client's
# own pixels, so a scroll bar at the window's edge keeps working.
grip = 8.0
# Along an edge, this far from a corner a press grabs the corner (both edges) instead.
corner = 20.0
# Two presses on the bar within this many milliseconds maximise (or restore).
double_click_ms = 400
# Focus and close-button hover change on this ease-out (cubic, like the menus). 0 = instant.
ease_ms = 140
# Title text. Both sit on chrome glass, whose luminance ceiling bounds the worst-case backdrop at
# Y = 0.1127, so a text luminance Y gives a floor of (Y + 0.05) / 0.1627:
#   focused   L 0.98 -> Y 0.941 -> 6.1:1        unfocused L 0.90 -> Y 0.729 -> 4.8:1
# compositor/tests/visual.rs asserts both over the worst backdrop. The unfocused title is also regular
# weight where the focused one is bold, so focus never rests on colour alone.
text_oklab = [0.98, 0.0, 0.0]
text_dim_oklab = [0.90, 0.0, 0.0]
# The focused window's stripe and close glyph: Haiku's tab yellow.
accent_oklab = [0.86, 0.0, 0.16]
# The close button's fill when the pointer is over it.
close_oklab = [0.62, 0.20, 0.10]

[indicator]
# The capability-in-use indicator (decision 0016): a dot the compositor draws above everything,
# including a fullscreen client, and leaves out of every screen capture, while a domain HOLDS one
# of the capabilities below. It is driven by the grant lifecycle (the daemon's own bus.cap.minted and
# bus.cap.revoked), not by watching a device. Windowed apps that run outside a domain hold no grants
# and are not shown: read the decision's "what this does not cover" before relying on it.
enabled = true
# Exact capability names, as the bus carries them. device:wayland (a domain that can see and inject
# into the display) is on. device:gpu is off: a render node can compute but cannot see the screen,
# GPU kits are expected to run often, and a dot that lights for every one trains the eye to ignore
# the dot that matters. Add "device:gpu" here to see it. When camera and microphone classes exist
# ("device:camera", "device:mic"), list them here; they are not named by default because nothing
# grants them yet and a guessed name would silently show nothing.
classes = ["device:wayland"]
# Distance from the output's top-right corner, logical pixels.
margin = 10.0
# The pill and the detail panel fade in on this ease-out (cubic, like the menus). 0 = instant.
ease_ms = 140
# The dot: orange-red. The compositor draws nothing else in this colour.
dot_oklab = [0.72, 0.17, 0.14]
# Text sits on its own opaque panel, so its contrast does not depend on the backdrop:
#   text L 0.97 on panel L 0.22 -> about 15:1;  dim L 0.84 -> about 10:1  (asserted on pixels in tests/indicator.rs)
text_oklab = [0.97, 0.0, 0.0]
text_dim_oklab = [0.84, 0.0, 0.0]
panel_oklab = [0.22, 0.0, 0.0]
